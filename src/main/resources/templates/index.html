<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재고닷컴 - 재고 공유 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; min-height: 100vh; display: flex; flex-direction: column; }
        .content { flex: 1; }
        .navbar-brand { font-weight: bold; color: #0d6efd !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">📦 재고닷컴</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/product/list}">상품찾기</a></li>
                <li class="nav-item" th:if="${session.user != null}"><a class="nav-link" th:href="@{/order/myOrders}">내 주문내역</a></li>
                <li class="nav-item" th:if="${session.user != null}"><a class="nav-link" th:href="@{/product/myList}">내 판매상품</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/inquiry/list}">고객문의</a></li>
            </ul>
            <ul class="navbar-nav">
                <th:block th:if="${session.user == null}">
                    <li class="nav-item"><a class="nav-link" th:href="@{/member/login}">로그인</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/member/signup}">회원가입</a></li>
                </th:block>

                <th:block th:if="${session.user != null}">
                    <li class="nav-item">
                        <a class="nav-link text-info" th:href="@{/member/mypage}" th:text="${session.user.name} + '님'">사용자님</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/member/logout}">로그아웃</a></li>
                </th:block>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5 content">
    <div class="d-flex justify-content-between align-items-center gap-3 mb-4">
        <h2 class="fw-bold mb-end">📦 실시간 재고 목록</h2>
        <a th:href="@{/product/register}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i>상품 등록
        </a>
    </div>

    <div class="card mb-5 shadow-sm border-0">
        <div class="card-body bg-white p-4 rounded">
            <form th:action="@{/}" method="get" class="row g-3 justify-content-center">
                <div class="col-md-6">
                    <input type="text" name="pname" th:value="${pname}" class="form-control" placeholder="상품명을 입력하세요">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-dark px-4">검색</button>
                </div>
            </form>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
        <div class="col" th:each="product : ${productList}">
            <div class="card h-100 shadow-sm border-0">
                <div class="bg-light text-center py-4 rounded-top position-relative">
                    <div class="position-relative overflow-hidden rounded-top" style="height: 200px;">
                        <img th:if="${product.img != null and product.img != 'no_image.png'}"
                             th:src="@{/product/display(fileName=${product.img})}"
                             class="card-img-top w-100 h-100" style="object-fit: cover;" alt="상품 이미지">

                        <img th:if="${product.img == null or product.img == 'no_image.png'}"
                             th:src="@{/images/no_image.png}"
                             class="card-img-top w-100 h-100" style="object-fit: cover;" alt="기본 이미지">

                        <span class="position-absolute top-0 end-0 m-2 badge rounded-pill bg-dark opacity-75"
                              th:text="${product.unit}">m</span>
                    </div>
                </div>

                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title fw-bold mb-0" th:text="${product.pname}">상품명</h5>
                        <span class="badge bg-primary" th:text="${product.category}">카테고리</span>
                    </div>

                    <p class="card-text text-muted small mb-3"
                       th:text="${#strings.abbreviate(product.content, 50)}">상품 설명 요약...</p>

                    <div class="d-flex justify-content-between align-items-center">
                        <div class="text-danger fw-bold h5 mb-0">
                        <span class="text-danger fw-bold h5 mb-0"
                              th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')} + '원'">0원</span>
                        </div>
                        <div class="text-end">
                            <small class="text-muted d-block">재고: <span th:text="${product.stock}">0</span>개</small>
                        </div>
                    </div>
                </div>

                <div class="card-footer bg-white border-top-0 pb-3">
                    <div class="d-grid gap-2">
                        <a th:href="@{/product/read/{id}(id=${product.pid})}" class="btn btn-outline-dark btn-sm">상세보기</a>
                        <button class="btn btn-primary btn-sm" th:if="${session.user != null}">장바구니 담기</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(productList)}" class="text-center py-5">
        <i class="bi bi-search display-1 text-light"></i>
        <p class="text-muted mt-3">등록된 상품 정보가 없습니다.</p>
    </div>
</div>

<footer class="bg-white text-center py-4 text-muted border-top">
    <div class="container">
        <p class="mb-0">&copy; 2026 Stock Pro System. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
