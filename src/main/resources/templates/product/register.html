<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재고닷컴 - 재고 공유 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; min-height: 100vh; display: flex; flex-direction: column; }
        .content { flex: 1; }
        .navbar-brand { font-weight: bold; color: #0d6efd !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">📦 재고닷컴</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/product/list}">상품찾기</a></li>
                <li class="nav-item" th:if="${session.user != null}"><a class="nav-link" th:href="@{/order/myOrders}">내 주문내역</a></li>
                <li class="nav-item" th:if="${session.user != null}"><a class="nav-link" th:href="@{/product/myList}">내 판매상품</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/inquiry/list}">고객문의</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" th:if="${session.user == null}"><a class="nav-link" th:href="@{/member/login}">로그인</a></li>
                <li class="nav-item" th:if="${session.user == null}"><a class="nav-link" th:href="@{/member/signup}">회원가입</a></li>
                <li class="nav-item" th:if="${session.user != null}">
                    <a class="nav-link text-info" th:href="@{/member/mypage}" th:text="${session.user.name} + '님'"></a>
                </li>
                <li class="nav-item" th:if="${session.user != null}"><a class="nav-link" th:href="@{/member/logout}">로그아웃</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5 content">
    <div class="row justify-content-center">
        <div class="col-md-8 card p-4 shadow-sm">
            <h3 class="mb-4">재고 등록</h3>
            <form th:action="@{/product/register}" method="post" enctype="multipart/form-data">
                <div class="row mb-3">
                    <div class="col-md-8">
                        <label class="form-label">상품명</label>
                        <input type="text" name="pname" class="form-control" placeholder="예: UTP Cat.6" required>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">제조사</label>
                        <input type="text" name="manufacturer" class="form-control" placeholder="예: LS전선">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-8">
                        <label class="form-label">카테고리</label>
                        <select name="category" class="form-select">
                            <option value="UTP">UTP</option>
                            <option value="광케이블">광케이블</option>
                            <option value="동축">동축</option>
                        </select>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label">단가 (원)</label>
                        <input type="number" name="price" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">보유 수량</label>
                        <input type="number" name="stock" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">단위</label>
                        <select name="unit" class="form-select">
                            <option value="m">m (미터)</option>
                            <option value="unit">unit (조)</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-12">
                    <label class="form-label">이미지 첨부(최대 5장)</label>
                    <input type="file" name="imgFiles" id="imgFiles" class="form-control" accept="image/*" multiple>
                    <div id="fileHelp" class="form-text text-danger">사진은 최대 5장까지만 등록 가능합니다.</div>

                    <div id="imagePreviewContainer" class="d-flex flex-wrap gap-3 mt-3"></div>
                </div>

                <div class="col-md-12">
                    <label class="form-label">상품 설명</label>
                    <textarea name="content" class="form-control"
                              style="min-height: 150px; max-height: 300px; overflow-y: auto;"
                              placeholder="물건에 대한 설명을 기재해주세요"></textarea>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-3">
                    <button type="button" class="btn btn-secondary" onclick="history.back()">취소</button>
                    <button type="submit" class="btn btn-primary">등록하기</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer class="bg-white text-center py-4 text-muted border-top">
    <div class="container">
        <p class="mb-0">&copy; 2026 Stock Pro System. All rights reserved.</p>
    </div>
</footer>

<script>
    const imgInput = document.getElementById('imgFiles');
    const previewContainer = document.getElementById('imagePreviewContainer');
    const MAX_FILES = 5;
    let fileList = [];

    imgInput.addEventListener('change', function(e) {
        const newFiles = Array.from(e.target.files);

        // 1. 개수 체크
        if (fileList.length + newFiles.length > MAX_FILES) {
            alert(`최대 ${MAX_FILES}장까지만 업로드 가능합니다.`);
            this.value = "";
            return;
        }

        // 2. 파일 목록 업데이트
        newFiles.forEach(file => {
            fileList.push(file);

            const reader = new FileReader();
            reader.onload = function(event) {
                const card = document.createElement('div');
                card.className = 'position-relative';
                card.style = 'width: 100px; height: 100px;';
                card.innerHTML = `
                    <img src="${event.target.result}" class="img-thumbnail w-100 h-100" style="object-fit: cover;">
                    <button type="button" class="btn btn-danger btn-sm position-absolute top-0 end-0 py-0 px-1">&times;</button>
                `;

                card.querySelector('button').addEventListener('click', function() {
                    const index = fileList.indexOf(file);
                    if (index > -1) {
                        fileList.splice(index, 1);
                        updateInputFiles(); // 삭제 후 반영
                    }
                    card.remove();
                });
                previewContainer.appendChild(card);
            };
            reader.readAsDataURL(file);
        });

        // 3. 폼 데이터 동기화 (파일 선택 즉시 실행)
        updateInputFiles();
    });

    function updateInputFiles() {
        const dataTransfer = new DataTransfer();
        fileList.forEach(file => dataTransfer.items.add(file));
        imgInput.files = dataTransfer.files; // 실제 input 태그에 파일 목록 갱신
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
