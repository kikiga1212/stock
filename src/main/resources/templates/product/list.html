<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재고닷컴 - 재고 공유 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; min-height: 100vh; display: flex; flex-direction: column; }
        .content { flex: 1; }
        .navbar-brand { font-weight: bold; color: #0d6efd !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">📦 재고닷컴</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/product/list}">상품찾기</a></li>
                <li class="nav-item" th:if="${session.user != null}"><a class="nav-link" th:href="@{/order/myOrders}">내 주문내역</a></li>
                <li class="nav-item" th:if="${session.user != null}"><a class="nav-link" th:href="@{/product/myList}">내 판매상품</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/inquiry/list}">고객문의</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" th:if="${session.user == null}"><a class="nav-link" th:href="@{/member/login}">로그인</a></li>
                <li class="nav-item" th:if="${session.user == null}"><a class="nav-link" th:href="@{/member/signup}">회원가입</a></li>
                <li class="nav-item" th:if="${session.user != null}">
                    <a class="nav-link text-info" th:href="@{/member/mypage}" th:text="${session.user.name} + '님'"></a>
                </li>
                <li class="nav-item" th:if="${session.user != null}"><a class="nav-link" th:href="@{/member/logout}">로그아웃</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5 content">

    <div class="d-flex justify-content-between align-items-center gap-3 mb-4">
        <h2 class="fw-bold mb-end">📦 상품 재고 목록</h2>
        <a th:href="@{/product/register}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i>상품 등록
        </a>
    </div>

    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form th:action="@{/product/list}" method="get" class="row g-3">
                <div class="col-auto">
                    <input type="text" name="pname" th:value="${pname}" class="form-control" placeholder="상품명을 입력하세요">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-dark">검색</button>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive shadow-sm">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>번호</th>
                <th>이미지</th>
                <th>상품명</th>
                <th>제조사</th>
                <th>단가</th>
                <th>재고</th>
                <th>등록일</th>
                <th>판매자</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${products}" th:onclick="|location.href='@{/product/read/{pid}(pid=${p.pid})}'|" style="cursor: pointer;">
                <td th:text="${p.pid}" scope="row"></td>
                <td>
                <td>
                    <img th:if="${p.img != 'no_image.png'}"
                         th:src="@{/product/display(fileName=${p.img})}"
                         class="img-thumbnail" style="width: 100px; height: 100px; object-fit: cover;">

                    <img th:if="${p.img == 'no_image.png'}"
                         th:src="@{/images/no_image.png}"
                         class="img-thumbnail" style="width: 100px; height: 100px; object-fit: cover;">
                </td>
                </td>
                <td th:text="${p.pname}" class="fw-bold"></td>
                <td th:text="${p.manufacturer}"></td>
                <td th:text="${#numbers.formatInteger(p.price, 0, 'COMMA')} + '원'"></td>
                <td th:text="${p.stock} + ' ' + ${p.unit}"></td>
                <td th:text="${#temporals.format(p.regDate, 'yyyy-MM-dd')}"></td>
                <td th:text="${p.seller.name}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="6" class="text-center py-5 text-muted">등록된 상품이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav aria-label="Page navigation" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${pageInfo.current == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/product/list(page=${pageInfo.pre}, pname=${pname})}">이전</a>
            </li>

            <li class="page-item" th:each="i : ${#numbers.sequence(pageInfo.startPage, pageInfo.endPage)}"
                th:classappend="${i == pageInfo.current} ? 'active'">
                <a class="page-link" th:text="${i}" th:href="@{/product/list(page=${i}, pname=${pname})}"></a>
            </li>

            <li class="page-item" th:classappend="${pageInfo.current == pageInfo.last} ? 'disabled'">
                <a class="page-link" th:href="@{/product/list(page=${pageInfo.next}, pname=${pname})}">다음</a>
            </li>
        </ul>
    </nav>


</div>

<footer class="bg-white text-center py-4 text-muted border-top">
    <div class="container">
        <p class="mb-0">&copy; 2026 Stock Pro System. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
