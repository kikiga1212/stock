<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 수정 - 재고닷컴</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .card { border: none; border-radius: 15px; }
    .img-thumbnail { border-radius: 10px; }
  </style>
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm p-4">
        <h3 class="mb-4 text-primary"><i class="bi bi-pencil-square"></i> 상품 정보 수정</h3>
        <hr>

        <form th:action="@{/product/update}" method="post" enctype="multipart/form-data">
          <input type="hidden" name="pid" th:value="${product.pid}">

          <div class="row mb-3">
            <div class="col-md-12">
              <label class="form-label fw-bold">상품명</label>
              <input type="text" name="pname" class="form-control" th:value="${product.pname}" required>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label fw-bold">제조사</label>
              <input type="text" name="manufacturer" class="form-control" th:value="${product.manufacturer}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">카테고리</label>
              <select name="category" class="form-select">
                <option value="UTP" th:selected="${product.category == 'UTP'}">UTP</option>
                <option value="광케이블" th:selected="${product.category == '광케이블'}">광케이블</option>
                <option value="동축" th:selected="${product.category == '동축'}">동축</option>
              </select>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-4">
              <label class="form-label fw-bold">단가 (원)</label>
              <input type="number" name="price" class="form-control" th:value="${product.price}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">보유 수량</label>
              <input type="number" name="stock" class="form-control" th:value="${product.stock}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">단위</label>
              <select name="unit" class="form-select">
                <option value="m" th:selected="${product.unit == 'm'}">m (미터)</option>
                <option value="unit" th:selected="${product.unit == 'unit'}">unit (조)</option>
              </select>
            </div>
          </div>

          <div class="col-md-12 mb-3">
            <label class="form-label fw-bold">이미지 교체 (새로 선택 시 기존 이미지는 대체됩니다)</label>
            <input type="file" name="imgFiles" id="imgFiles" class="form-control" accept="image/*" multiple>
            <div id="fileHelp" class="form-text text-danger">최대 5장까지 가능합니다.</div>

            <div id="imagePreviewContainer" class="d-flex flex-wrap gap-3 mt-3">
              <div class="position-relative" style="width: 100px; height: 100px;">
                <img th:src="@{/product/display(fileName=${product.img})}"
                     class="img-thumbnail w-100 h-100" style="object-fit: cover;">
                <span class="badge bg-secondary position-absolute bottom-0 start-0 w-100">기존대표</span>
              </div>
            </div>
          </div>

          <div class="col-md-12 mb-4">
            <label class="form-label fw-bold">상품 설명</label>
            <textarea name="content" class="form-control" rows="5" th:text="${product.content}"></textarea>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-outline-secondary" onclick="history.back()">취소</button>
            <button type="submit" class="btn btn-primary px-4">수정 완료</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  const imgInput = document.getElementById('imgFiles');
  const previewContainer = document.getElementById('imagePreviewContainer');
  const MAX_FILES = 5;
  let fileList = [];

  imgInput.addEventListener('change', function(e) {
    const files = Array.from(e.target.files);

    if (fileList.length + files.length > MAX_FILES) {
      alert(`최대 ${MAX_FILES}장까지만 업로드 가능합니다.`);
      this.value = "";
      return;
    }

    // 새 파일 선택 시 기존 미리보기는 비우고 싶다면 아래 주석 해제
    // previewContainer.innerHTML = '';
    // fileList = [];

    files.forEach(file => {
      fileList.push(file);
      const reader = new FileReader();
      reader.onload = function(event) {
        const card = document.createElement('div');
        card.className = 'position-relative';
        card.style = 'width: 100px; height: 100px;';
        card.innerHTML = `
                    <img src="${event.target.result}" class="img-thumbnail w-100 h-100" style="object-fit: cover;">
                    <button type="button" class="btn btn-danger btn-sm position-absolute top-0 end-0 py-0 px-1">&times;</button>
                `;

        card.querySelector('button').addEventListener('click', function() {
          const index = fileList.indexOf(file);
          if (index > -1) {
            fileList.splice(index, 1);
            updateInputFiles();
          }
          card.remove();
        });
        previewContainer.appendChild(card);
      };
      reader.readAsDataURL(file);
    });
    updateInputFiles();
  });

  function updateInputFiles() {
    const dataTransfer = new DataTransfer();
    fileList.forEach(file => dataTransfer.items.add(file));
    document.getElementById('imgFiles').files = dataTransfer.files;
  }
</script>

</body>
</html>
