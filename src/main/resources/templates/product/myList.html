<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재고닷컴 - 재고 공유 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; min-height: 100vh; display: flex; flex-direction: column; }
        .content { flex: 1; }
        .navbar-brand { font-weight: bold; color: #0d6efd !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">📦 재고닷컴</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/product/list}">상품찾기</a></li>
                <li class="nav-item" th:if="${session.user != null}"><a class="nav-link" th:href="@{/order/myOrders}">내 주문내역</a></li>
                <li class="nav-item" th:if="${session.user != null}"><a class="nav-link" th:href="@{/product/myList}">내 판매상품</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/inquiry/list}">고객문의</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" th:if="${session.user == null}"><a class="nav-link" th:href="@{/member/login}">로그인</a></li>
                <li class="nav-item" th:if="${session.user == null}"><a class="nav-link" th:href="@{/member/signup}">회원가입</a></li>
                <li class="nav-item" th:if="${session.user != null}">
                    <a class="nav-link text-info" th:href="@{/member/mypage}" th:text="${session.user.name} + '님'"></a>
                </li>
                <li class="nav-item" th:if="${session.user != null}"><a class="nav-link" th:href="@{/member/logout}">로그아웃</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5 content">
    <div class="d-flex justify-content-between mb-4">
        <h2>내가 등록한 상품</h2>
        <a th:href="@{/product/register}" class="btn btn-success">신규 상품 등록</a>
    </div>
    <table class="table bg-white shadow-sm rounded overflow-hidden">
        <thead class="table-dark">
        <tr><th>이미지</th><th>상품명</th><th>재고</th><th>가격</th><th>관리</th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${products}" class="align-middle">
            <td><img th:src="@{/product/display(fileName=${p.img})}" width="50" height="50" class="rounded"></td>
            <td th:text="${p.pname}"></td>
            <td th:text="${p.stock} + ' ' + ${p.unit}"></td>
            <td th:text="${p.price} + '원'"></td>
            <td>
                <a th:href="@{/product/update/{pid}(pid=${p.pid})}" class="btn btn-sm btn-outline-primary">수정</a>
                <form th:action="@{/product/delete/{pid}(pid=${p.pid})}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-outline-danger" onclick="return confirm('삭제하시겠습니까?')">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<footer class="bg-white text-center py-4 text-muted border-top">
    <div class="container">
        <p class="mb-0">&copy; 2026 Stock Pro System. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
