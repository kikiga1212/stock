<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재고닷컴 - 재고 공유 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; min-height: 100vh; display: flex; flex-direction: column; }
        .content { flex: 1; }
        .navbar-brand { font-weight: bold; color: #0d6efd !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">📦 재고닷컴</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/product/list}">상품찾기</a></li>
                <li class="nav-item" th:if="${session.user != null}"><a class="nav-link" th:href="@{/order/myOrders}">내 주문내역</a></li>
                <li class="nav-item" th:if="${session.user != null}"><a class="nav-link" th:href="@{/product/myList}">내 판매상품</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/inquiry/list}">고객문의</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" th:if="${session.user == null}"><a class="nav-link" th:href="@{/member/login}">로그인</a></li>
                <li class="nav-item" th:if="${session.user == null}"><a class="nav-link" th:href="@{/member/signup}">회원가입</a></li>
                <li class="nav-item" th:if="${session.user != null}">
                    <a class="nav-link text-info" th:href="@{/member/mypage}" th:text="${session.user.name} + '님'"></a>
                </li>
                <li class="nav-item" th:if="${session.user != null}"><a class="nav-link" th:href="@{/member/logout}">로그아웃</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5 content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm p-4">
                <h3 class="mb-4 text-primary"><i class="bi bi-pencil-square"></i> 상품 정보 수정</h3>
                <hr>

                <form th:action="@{/product/update}" method="post" enctype="multipart/form-data">
                    <input type="hidden" name="pid" th:value="${product.pid}">

                    <div class="row mb-3">
                        <div class="col-md-12">
                            <label class="form-label fw-bold">상품명</label>
                            <input type="text" name="pname" class="form-control" th:value="${product.pname}" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">제조사</label>
                            <input type="text" name="manufacturer" class="form-control" th:value="${product.manufacturer}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">카테고리</label>
                            <select name="category" class="form-select">
                                <option value="UTP" th:selected="${product.category == 'UTP'}">UTP</option>
                                <option value="광케이블" th:selected="${product.category == '광케이블'}">광케이블</option>
                                <option value="동축" th:selected="${product.category == '동축'}">동축</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">단가 (원)</label>
                            <input type="number" name="price" class="form-control" th:value="${product.price}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">보유 수량</label>
                            <input type="number" name="stock" class="form-control" th:value="${product.stock}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">단위</label>
                            <select name="unit" class="form-select">
                                <option value="m" th:selected="${product.unit == 'm'}">m (미터)</option>
                                <option value="unit" th:selected="${product.unit == 'unit'}">unit (조)</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label class="form-label fw-bold">이미지 교체 (새로 선택 시 기존 이미지는 대체됩니다)</label>
                        <input type="file" name="imgFiles" id="imgFiles" class="form-control" accept="image/*" multiple>

                        <div id="fileHelp" class="form-text text-danger">최대 5장까지 가능합니다.</div>

                        <input type="hidden" name="removedFiles" id="removedFiles" value="">

                        <div id="imagePreviewContainer" class="d-flex flex-wrap gap-3 mt-3">
                            <th:block th:if="${product.imageList != null}">
                                <div th:each="image : ${product.imageList}" class="position-relative" style="width: 100px; height: 100px;">
                                    <img th:src="@{/product/display(fileName=${image.uuid + '_' + image.imgName})}"
                                         class="img-thumbnail w-100 h-100" style="object-fit: cover;">

                                    <button type="button"
                                            class="btn btn-danger btn-sm position-absolute top-0 end-0 py-0 px-1"
                                            th:onclick="removeExistingImage(this, [[${image.uuid + '_' + image.imgName}]])">&times;</button>
                                </div>
                            </th:block>
                        </div>
                    </div>

                    <div class="col-md-12 mb-4">
                        <label class="form-label fw-bold">상품 설명</label>
                        <textarea name="content" class="form-control" rows="5" th:text="${product.content}"></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-outline-secondary" onclick="history.back()">취소</button>
                        <button type="submit" class="btn btn-primary px-4">수정 완료</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    let removedFilesList = []; // 삭제할 파일명을 담는 배열

    // [1] 기존 이미지 삭제 함수 (작동 확인됨)
    function removeExistingImage(button, fileName) {
        if (confirm("이 이미지를 삭제하시겠습니까?")) {
            button.closest('.position-relative').remove();
            removedFilesList.push(fileName);
            document.getElementById('removedFiles').value = removedFilesList.join(',');
            console.log("삭제 대기 목록:", document.getElementById('removedFiles').value);
        }
    }

    // [2] 새 파일 선택 및 미리보기 로직 (여러 장 처리 추가)
    const imgInput = document.getElementById('imgFiles');
    const previewContainer = document.getElementById('imagePreviewContainer');
    const MAX_FILES = 5;

    imgInput.addEventListener('change', function(e) {
        const files = Array.from(e.target.files);

        // 새로 추가된 미리보기만 찾아 제거 (기존 이미지는 유지)
        const newPreviews = previewContainer.querySelectorAll('.new-upload-preview');
        newPreviews.forEach(el => el.remove());

        // 💡 중요: 개수 제한 체크 (선택한 파일 전체 개수)
        if (files.length > MAX_FILES) {
            alert(`새 이미지는 한 번에 최대 ${MAX_FILES}장까지만 업로드 가능합니다.`);
            this.value = ""; // 선택 초기화
            return;
        }

        // 💡 여러 장의 파일을 순회하며 미리보기 생성
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = function(event) {
                const div = document.createElement('div');
                div.className = 'position-relative new-upload-preview';
                div.style = 'width: 100px; height: 100px;';
                div.innerHTML = `
                    <img src="${event.target.result}" class="img-thumbnail w-100 h-100" style="object-fit: cover; border: 2px solid #0d6efd;">
                    <span class="badge bg-primary position-absolute bottom-0 start-0 w-100" style="font-size: 0.7rem;">New</span>
                `;
                previewContainer.appendChild(div);
            };
            reader.readAsDataURL(file);
        });
    });
</script>


<footer class="bg-white text-center py-4 text-muted border-top">
    <div class="container">
        <p class="mb-0">&copy; 2026 Stock Pro System. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
