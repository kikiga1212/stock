<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재고닷컴 - 재고 공유 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; min-height: 100vh; display: flex; flex-direction: column; }
        .content { flex: 1; }
        .navbar-brand { font-weight: bold; color: #0d6efd !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">📦 재고닷컴</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/product/list}">상품찾기</a></li>
                <li class="nav-item" th:if="${session.user != null}"><a class="nav-link" th:href="@{/order/myOrders}">내 주문내역</a></li>
                <li class="nav-item" th:if="${session.user != null}"><a class="nav-link" th:href="@{/product/myList}">내 판매상품</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/inquiry/list}">고객문의</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" th:if="${session.user == null}"><a class="nav-link" th:href="@{/member/login}">로그인</a></li>
                <li class="nav-item" th:if="${session.user == null}"><a class="nav-link" th:href="@{/member/signup}">회원가입</a></li>
                <li class="nav-item" th:if="${session.user != null}">
                    <a class="nav-link text-info" th:href="@{/member/mypage}" th:text="${session.user.name} + '님'"></a>
                </li>
                <li class="nav-item" th:if="${session.user != null}"><a class="nav-link" th:href="@{/member/logout}">로그아웃</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5 content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-clipboard-data"></i> 들어온 주문 관리</h2>
        <span class="text-muted" th:text="'총 ' + ${orders != null ? orders.size() : 0} + '건의 주문이 있습니다.'"></span>
    </div>

    <div class="card shadow-sm border-0 overflow-hidden">
        <table class="table table-hover mb-0">
            <thead class="table-dark">
            <tr class="text-center">
                <th>주문일</th>
                <th>주문번호</th>
                <th>상품명</th>
                <th>주문자</th>
                <th>수량</th>
                <th>결제금액</th>
                <th>상태관리</th>
            </tr>
            </thead>
            <tbody class="text-center">
            <tr th:if="${orders == null or #lists.isEmpty(orders)}">
                <td colspan="7" class="py-5 text-muted">들어온 주문이 없습니다.</td>
            </tr>
            <tr th:each="order : ${orders}" class="align-middle">
                <td th:text="${#temporals.format(order.regDate, 'MM-dd HH:mm')}">날짜</td>
                <td th:text="${order.oid}">123</td>
                <td class="text-start">
                    <strong th:text="${order.product.pname}">상품명</strong>
                </td>
                <td>
                    <span th:text="${order.buyer.name}">구매자</span><br>
                    <small class="text-muted" th:text="${order.buyer.phone}"></small>
                </td>
                <td th:text="${order.count} + '개'">1</td>
                <td class="fw-bold text-primary" th:text="${#numbers.formatInteger(order.totalPrice, 0, 'COMMA')} + '원'">금액</td>
                <td>
                    <form th:action="@{/order/updateStatus}" method="post" class="d-flex gap-1 justify-content-center">
                        <input type="hidden" name="oid" th:value="${order.oid}">
                        <select name="status" class="form-select form-select-sm" style="width: auto;">
                            <option value="PENDING" th:selected="${order.status == 'PENDING'}">결제완료</option>
                            <option value="SHIPPING" th:selected="${order.status == 'SHIPPING'}">배송중</option>
                            <option value="DELIVERED" th:selected="${order.status == 'DELIVERED'}">배송완료</option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-dark">변경</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer class="bg-white text-center py-4 text-muted border-top">
    <div class="container">
        <p class="mb-0">&copy; 2026 Stock Pro System. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
