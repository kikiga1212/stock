<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재고닷컴 - 재고 공유 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; min-height: 100vh; display: flex; flex-direction: column; }
        .content { flex: 1; }
        .navbar-brand { font-weight: bold; color: #0d6efd !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">📦 재고닷컴</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/product/list}">상품찾기</a></li>
                <li class="nav-item" th:if="${session.user != null}"><a class="nav-link" th:href="@{/order/myOrders}">내 주문내역</a></li>
                <li class="nav-item" th:if="${session.user != null}"><a class="nav-link" th:href="@{/product/myList}">내 판매상품</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/inquiry/list}">고객문의</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" th:if="${session.user == null}"><a class="nav-link" th:href="@{/member/login}">로그인</a></li>
                <li class="nav-item" th:if="${session.user == null}"><a class="nav-link" th:href="@{/member/signup}">회원가입</a></li>
                <li class="nav-item" th:if="${session.user != null}">
                    <a class="nav-link text-info" th:href="@{/member/mypage}" th:text="${session.user.name} + '님'"></a>
                </li>
                <li class="nav-item" th:if="${session.user != null}"><a class="nav-link" th:href="@{/member/logout}">로그아웃</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5 content">

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-3">
            <div class="d-flex justify-content-between align-items-center">
                <h4 class="mb-0 fw-bold" th:text="${inquiry.title}">배송 정보가 궁금합니다.</h4>
                <span th:if="${inquiry.status == 'ANSWERED'}" class="badge bg-success">답변완료</span>
                <span th:unless="${inquiry.status == 'ANSWERED'}" class="badge bg-secondary">답변대기</span>
            </div>
            <div class="mt-2 text-muted small">
                <span class="me-3">작성자: <b th:text="${inquiry.writerName}">홍길동</b></span>
                <span>작성일: <b th:text="${#temporals.format(inquiry.regDate, 'yyyy-MM-dd HH:mm')}">2026-03-17 10:00</b></span>
            </div>
        </div>
        <div class="card-body py-5 px-4" style="min-height: 200px; white-space: pre-wrap;" th:text="${inquiry.content}">
            문의 내용 본문이 여기에 출력됩니다.
        </div>
        <div class="card-footer bg-white text-end py-3">
            <a th:href="@{/inquiry/list}" class="btn btn-outline-secondary">목록으로</a>
            <th:block th:if="${session.user != null and session.user.mid == inquiry.writerId}">
                <a th:href="@{/inquiry/update/{id}(id=${inquiry.id})}" class="btn btn-outline-primary">수정</a>
                <button class="btn btn-outline-danger" onclick="deleteInquiry()">삭제</button>
            </th:block>
        </div>
    </div>

    <div class="card border-0 shadow-sm bg-light" th:if="${inquiry.reply != null}">
        <div class="card-body p-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-arrow-return-right me-2"></i>관리자 답변</h5>
            <div class="bg-white p-3 rounded border" style="white-space: pre-wrap;" th:text="${inquiry.reply.content}">
                안녕하세요, 고객님. 해당 상품은 금일 발송될 예정입니다.
            </div>
            <div class="mt-2 text-muted small text-end">
                답변일: <span th:text="${#temporals.format(inquiry.reply.regDate, 'yyyy-MM-dd HH:mm')}">2026-03-17</span>
            </div>
        </div>
    </div>


    <script th:inline="javascript">
        function deleteInquiry() {
            if(confirm("정말로 이 문의를 삭제하시겠습니까?")) {
                // 삭제 요청 로직 (예시)
                const id = [[${inquiry.iid}]];
                location.href = "/inquiry/delete/" + id;
            }
        }
    </script>
</div>
<footer class="bg-white text-center py-4 text-muted border-top">
    <div class="container">
        <p class="mb-0">&copy; 2026 Stock Pro System. All rights reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
